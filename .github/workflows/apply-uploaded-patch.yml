name: Apply uploaded MoCreatures patch

on:
  push:
    branches: [ "agent/finish-neoforge-port" ]
    paths:
      - ".github/mocreatures-fixes.patch"
      - ".github/workflows/apply-uploaded-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          HORSE='src/main/java/drzhark/mocreatures/entity/passive/MoCEntityHorse.java'
          CLIENT='src/main/java/drzhark/mocreatures/event/MoCClientEvents.java'

          git apply --check --exclude="$HORSE" --exclude="$CLIENT" .github/mocreatures-fixes.patch
          git apply --exclude="$HORSE" --exclude="$CLIENT" .github/mocreatures-fixes.patch

          python3 <<'PY'
          from pathlib import Path

          horse = Path('src/main/java/drzhark/mocreatures/entity/passive/MoCEntityHorse.java')
          s = horse.read_text(encoding='utf-8')
          if 'import net.minecraft.world.item.enchantment.Enchantments;' not in s:
              anchor = 'import net.minecraft.world.damagesource.DamageSource;\n'
              assert anchor in s, 'Horse DamageSource import anchor not found'
              s = s.replace(anchor, anchor +
                  'import net.minecraft.world.item.enchantment.Enchantments;\n'
                  'import net.minecraft.world.item.enchantment.EnchantmentHelper;\n'
                  'import net.minecraft.world.entity.LivingEntity;\n', 1)
          old = '        int looting = 0; // TODO 1.21: custom looting bonus should be derived from enchantment context if desired.\n'
          new = ('        int looting = 0;\n'
                 '        if (source.getEntity() instanceof LivingEntity lootingAttacker) {\n'
                 '            looting = EnchantmentHelper.getEnchantmentLevel(\n'
                 '                    serverLevel.registryAccess().holderOrThrow(Enchantments.LOOTING), lootingAttacker);\n'
                 '        }\n')
          assert old in s, 'Horse looting placeholder not found'
          s = s.replace(old, new, 1)
          horse.write_text(s, encoding='utf-8')

          client = Path('src/main/java/drzhark/mocreatures/event/MoCClientEvents.java')
          client.write_text('''package drzhark.mocreatures.event;

import drzhark.mocreatures.MoCConstants;
import drzhark.mocreatures.MoCreatures;
import drzhark.mocreatures.client.renderer.fx.impl.MoCEntityFXStar;
import drzhark.mocreatures.client.renderer.fx.impl.MoCEntityFXUndead;
import drzhark.mocreatures.client.renderer.fx.impl.MoCEntityFXVacuum;
import drzhark.mocreatures.client.renderer.fx.impl.MoCEntityFXVanish;
import drzhark.mocreatures.client.renderer.fx.MoCParticles;
import net.minecraft.client.particle.SpriteSet;
import net.neoforged.api.distmarker.Dist;
import net.neoforged.neoforge.client.event.RegisterParticleProvidersEvent;
import net.neoforged.bus.api.SubscribeEvent;
import net.neoforged.fml.common.EventBusSubscriber;

@EventBusSubscriber(modid = MoCConstants.MOD_ID, value = Dist.CLIENT, bus = EventBusSubscriber.Bus.MOD)
public class MoCClientEvents {

    public static SpriteSet UNDEAD_SPRITE_SET, VANISH_SPRITE_SET, STAR_SPRITE_SET, VACUUM_SPRITE_SET;

    @SubscribeEvent
    public static void onRegisterParticleProviders(RegisterParticleProvidersEvent event) {
        event.registerSpriteSet(MoCParticles.UNDEAD_FX.get(), spriteSet -> {
            UNDEAD_SPRITE_SET = spriteSet;
            return new MoCEntityFXUndead.Factory(spriteSet);
        });

        event.registerSpriteSet(MoCParticles.VANISH_FX.get(), spriteSet -> {
            VANISH_SPRITE_SET = spriteSet;
            return new MoCEntityFXVanish.Provider(spriteSet);
        });

        event.registerSpriteSet(MoCParticles.STAR_FX.get(), spriteSet -> {
            STAR_SPRITE_SET = spriteSet;
            return new MoCEntityFXStar.Factory(spriteSet);
        });

        event.registerSpriteSet(MoCParticles.VACUUM_FX.get(), spriteSet -> {
            VACUUM_SPRITE_SET = spriteSet;
            return new MoCEntityFXVacuum.Factory(spriteSet);
        });

        MoCreatures.LOGGER.info("Mo'Creatures particle providers registered successfully");
    }
}
''', encoding='utf-8')
          PY

          rm .github/mocreatures-fixes.patch
          rm .github/workflows/apply-uploaded-patch.yml

          git add -A
          git diff --cached --check
          git commit -m "Apply uploaded MoCreatures fixes patch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
