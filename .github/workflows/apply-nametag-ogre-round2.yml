name: Apply round2 nametag and Ogre damage fixes

on:
  push:
    branches: [ "fix/nametag-ogre-damage-round2-2026-08-10-apply" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/nametag-ogre-damage-round2-2026-08-10-apply
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          animal = Path('src/main/java/drzhark/mocreatures/entity/MoCEntityAnimal.java')
          s = animal.read_text()
          old = '''        // A real custom pet name must win over MoC verbose species names.\n        // Vanilla name-tag rendering asks getName()/getDisplayName(), so ignoring\n        // CustomName here made renamed pets look named internally but blank overhead.\n        if (this.hasCustomName() && this.getCustomName() != null) {\n            return this.getCustomName();\n        }\n'''
          new = '''        // NAME_STR is Mo' Creatures' synchronized pet-name field. Use it as the\n        // primary client display name so the hover nametag always renders the\n        // actual name chosen in the MoC naming GUI.\n        String petName = this.getPetName();\n        if (petName != null && !petName.isEmpty()) {\n            return Component.literal(petName);\n        }\n        if (this.hasCustomName() && this.getCustomName() != null) {\n            return this.getCustomName();\n        }\n'''
          if old not in s:
              raise SystemExit('MoCEntityAnimal getName anchor not found')
          animal.write_text(s.replace(old, new, 1))

          renderer = Path('src/main/java/drzhark/mocreatures/client/renderer/entity/MoCRenderMoC.java')
          s = renderer.read_text()
          old_renderer = '''    @Override\n    public boolean shouldShowName(T entity) {\n        return false;\n    }\n'''
          new_renderer = '''    @Override\n    public boolean shouldShowName(T entity) {\n        // The legacy renderer disabled vanilla name rendering unconditionally.\n        // On 1.21 this also kills the normal "look at a named mob" nametag.\n        // NAME_STR is synchronized, so explicitly allow the hover label for a\n        // named MoC entity under the crosshair, then fall back to vanilla rules.\n        IMoCEntity entityMoC = (IMoCEntity) entity;\n        String petName = entityMoC.getPetName();\n        if (petName != null && !petName.isEmpty()\n                && Minecraft.getInstance().crosshairPickEntity == entity) {\n            return true;\n        }\n        return super.shouldShowName(entity);\n    }\n'''
          if old_renderer not in s:
              raise SystemExit('Existing MoCRenderMoC shouldShowName anchor not found')
          renderer.write_text(s.replace(old_renderer, new_renderer, 1))

          tools = Path('src/main/java/drzhark/mocreatures/MoCTools.java')
          s = tools.read_text()
          pattern = re.compile(r'''        if \(!level\.isClientSide\) \{\n            AABB blastBox = new AABB\(\n                    x - blastRadius, y - blastRadius, z - blastRadius,\n                    x \+ blastRadius, y \+ blastRadius, z \+ blastRadius\n            \);\n\n            Vec3 blastCenter = new Vec3\(x, y, z\);\n            List<Entity> entities = level\.getEntities\(entity, blastBox\);\n\n            for \(Entity e : entities\) \{.*?            \}\n        \}\n\n        // CLIENT: Spawn particles''', re.S)
          replacement = '''        if (!level.isClientSide) {\n            // Entity effects of an explosion reach farther than the block-breaking\n            // core. The old port used only `strength` and multiplied the result by\n            // line-of-sight exposure, which could turn the Ogre smash damage into 0.\n            double damageRadius = Math.max(2.0D, strength * 2.0D);\n            AABB blastBox = new AABB(\n                    x - damageRadius, y - damageRadius, z - damageRadius,\n                    x + damageRadius, y + damageRadius, z + damageRadius\n            );\n\n            Vec3 blastCenter = new Vec3(x, y, z);\n            List<LivingEntity> entities = level.getEntitiesOfClass(\n                    LivingEntity.class, blastBox,\n                    target -> target != entity && target.isAlive()\n            );\n            DamageSource blastDamage = level.damageSources().explosion(entity, entity);\n\n            for (LivingEntity target : entities) {\n                double rawDistance = Math.sqrt(target.distanceToSqr(blastCenter));\n                if (rawDistance > damageRadius) continue;\n\n                double impact = 1.0D - (rawDistance / damageRadius);\n                float damage = (float) (((impact * impact + impact) / 2.0D)\n                        * 7.0D * strength * 2.0D + 1.0D);\n\n                // Only the Ogre producing this blast is immune. Players, animals,\n                // monsters and other Ogres are all valid AOE victims.\n                target.hurt(blastDamage, Math.max(1.0F, damage));\n\n                Vec3 push = target.position().subtract(blastCenter);\n                double len = push.length();\n                if (len > 1.0E-4D) {\n                    push = push.scale(1.0D / len);\n                    target.setDeltaMovement(target.getDeltaMovement().add(\n                            push.x * impact, Math.max(0.15D, push.y * impact + 0.15D), push.z * impact\n                    ));\n                    target.hasImpulse = true;\n                }\n            }\n        }\n\n        // CLIENT: Spawn particles'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'MoCTools damage block replacement count={n}')
          tools.write_text(s2)
          PY

          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-nametag-ogre-round2.yml
          git add src/main/java/drzhark/mocreatures/entity/MoCEntityAnimal.java
          git add src/main/java/drzhark/mocreatures/client/renderer/entity/MoCRenderMoC.java
          git add src/main/java/drzhark/mocreatures/MoCTools.java
          git commit -m 'Fix hover pet nametags and Ogre smash entity damage'
          git push origin HEAD:fix/nametag-ogre-damage-round2-2026-08-10-apply
