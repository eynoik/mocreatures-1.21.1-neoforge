name: Apply gameplay balance and effects fixes

on:
  push:
    branches: [ "fix/balance-effects-weapons-2026-08-10" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/balance-effects-weapons-2026-08-10
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(s.replace(old, new, 1))

          # Ogre: modest ~14% increase to entity damage; blast radius stays unchanged.
          replace_one(
              'src/main/java/drzhark/mocreatures/MoCTools.java',
              '* 7.0D * strength * 2.0D + 1.0D);',
              '* 8.0D * strength * 2.0D + 1.0D);',
              'Ogre damage coefficient'
          )

          # 1.21 no longer calls the legacy doEnchantDamageEffects signature used by this port.
          # Move Komodo poison directly into the live attack path and make it Poison II.
          komodo = Path('src/main/java/drzhark/mocreatures/entity/hunter/MoCEntityKomodo.java')
          s = komodo.read_text()
          old = '''    public void doEnchantDamageEffects(LivingEntity entityLivingBaseIn, Entity entityIn) {\n        ((LivingEntity) entityIn).addEffect(new MobEffectInstance(MobEffects.POISON, 150, 0));\n}\n'''
          new = '''    @Override\n    public boolean doHurtTarget(Entity entityIn) {\n        boolean hit = super.doHurtTarget(entityIn);\n        if (hit && entityIn instanceof LivingEntity livingTarget) {\n            livingTarget.addEffect(new MobEffectInstance(MobEffects.POISON, 150, 1));\n        }\n        return hit;\n    }\n'''
          if old not in s:
              raise SystemExit('Komodo legacy poison hook anchor not found')
          komodo.write_text(s.replace(old, new, 1))

          # Wild scorpions already have an actual sting animation (animation 0), sting sound,
          # and original per-variant effects. Their old effect hook is dead on 1.21, so trigger
          # the same 20% special attack explicitly after a successful melee hit.
          scorpion = Path('src/main/java/drzhark/mocreatures/entity/hostile/MoCEntityScorpion.java')
          s = scorpion.read_text()
          import_anchor = 'import net.minecraft.world.entity.LivingEntity;\n'
          if import_anchor not in s:
              raise SystemExit('Scorpion effect import anchor not found')
          s = s.replace(import_anchor, import_anchor + 'import net.minecraft.world.effect.MobEffectInstance;\nimport net.minecraft.world.effect.MobEffects;\n', 1)
          old = '''    @Override\n    public boolean doHurtTarget(Entity entity) {\n        // Claw Attack Sound\n        if (this.poisontimer != 1) {\n            MoCTools.playCustomSound(this, MoCSoundEvents.ENTITY_SCORPION_CLAW.get());\n        }\n        return super.doHurtTarget(entity);\n    }\n'''
          new = '''    @Override\n    public boolean doHurtTarget(Entity entity) {\n        if (this.poisontimer != 1) {\n            MoCTools.playCustomSound(this, MoCSoundEvents.ENTITY_SCORPION_CLAW.get());\n        }\n\n        boolean hit = super.doHurtTarget(entity);\n        if (!hit || !(entity instanceof LivingEntity livingTarget)) {\n            return hit;\n        }\n\n        // Original Mo' Creatures special sting: 20% chance. setPoisoning(true)\n        // broadcasts the existing sting animation (animation type 0); no new animation.\n        if (!getIsPoisoning() && this.random.nextInt(5) == 0) {\n            setPoisoning(true);\n            switch (this.getTypeMoC) {\n                case 1 -> livingTarget.addEffect(new MobEffectInstance(MobEffects.POISON, 15 * 20, 1));\n                case 2 -> {\n                    livingTarget.addEffect(new MobEffectInstance(MobEffects.CONFUSION, 15 * 20, 0));\n                    livingTarget.addEffect(new MobEffectInstance(MobEffects.WEAKNESS, 15 * 20, 0));\n                }\n                case 3 -> livingTarget.igniteForSeconds(15);\n                case 4 -> livingTarget.addEffect(new MobEffectInstance(MobEffects.MOVEMENT_SLOWDOWN, 25 * 20, 0));\n                case 5 -> {\n                    livingTarget.addEffect(new MobEffectInstance(MobEffects.BLINDNESS, 15 * 20, 0));\n                    livingTarget.addEffect(new MobEffectInstance(MobEffects.WITHER, 15 * 20, 0));\n                }\n                default -> livingTarget.addEffect(new MobEffectInstance(MobEffects.POISON, 15 * 20, 1));\n            }\n        } else {\n            swingArm();\n        }\n        return true;\n    }\n'''
          if old not in s:
              raise SystemExit('Scorpion live attack anchor not found')
          scorpion.write_text(s.replace(old, new, 1))

          # Duck and Mouse define their intended low-health builders, but registration selected
          # inherited MoCEntityAnimal.createAttributes(), giving them the base animal health.
          entities = Path('src/main/java/drzhark/mocreatures/init/MoCEntities.java')
          s = entities.read_text()
          for old, new, label in [
              ('MoCEntityDuck::createAttributes', 'MoCEntityDuck::registerAttributes', 'Duck attributes'),
              ('MoCEntityMouse::createAttributes', 'MoCEntityMouse::registerAttributes', 'Mouse attributes'),
          ]:
              if old not in s:
                  raise SystemExit(f'{label}: registry anchor not found')
              s = s.replace(old, new, 1)
          entities.write_text(s)

          # The full-set scorpion armor effect helper exists and ArmorSetEffects defaults true,
          # but nothing called it. Refresh it on the registered GAME bus once per second.
          hooks = Path('src/main/java/drzhark/mocreatures/event/MoCEventHooks.java')
          s = hooks.read_text()
          import_anchor = 'import net.neoforged.neoforge.event.level.LevelEvent;\n'
          if import_anchor not in s:
              raise SystemExit('Player tick import anchor not found')
          s = s.replace(import_anchor, import_anchor + 'import net.neoforged.neoforge.event.tick.PlayerTickEvent;\n', 1)
          method_anchor = '''    @SubscribeEvent\n    public void onPlayerLogout(PlayerEvent.PlayerLoggedOutEvent event) {\n        Player player = event.getEntity();\n        if (player.getVehicle() instanceof IMoCTameable) {\n            IMoCTameable mocEntity = (IMoCTameable) player.getVehicle();\n            mocEntity.setRiderDisconnecting(true);\n        }\n    }\n'''
          method_replacement = method_anchor + '''\n    @SubscribeEvent\n    public void onPlayerTick(PlayerTickEvent.Post event) {\n        Player player = event.getEntity();\n        if (!player.level().isClientSide() && player.tickCount % 20 == 0) {\n            MoCTools.updatePlayerArmorEffects(player);\n        }\n    }\n'''
          if method_anchor not in s:
              raise SystemExit('Player tick method anchor not found')
          hooks.write_text(s.replace(method_anchor, method_replacement, 1))

          # Silver Skeleton Sword keeps its fixed 10-damage werewolf hit. Golden Sword now bypasses
          # the generic werewolf sword reduction and keeps the actual vanilla incoming damage.
          were = Path('src/main/java/drzhark/mocreatures/entity/hostile/MoCEntityWerewolf.java')
          s = were.read_text()
          import_anchor = 'import net.minecraft.world.item.ItemStack;\n'
          if import_anchor not in s:
              raise SystemExit('Werewolf Items import anchor not found')
          s = s.replace(import_anchor, import_anchor + 'import net.minecraft.world.item.Items;\n', 1)
          old = '''                if (stack.getItem() == MoCItems.SILVERSWORD.get()) {\n                    i = 10F;\n                } else if (stack.getItem() instanceof SwordItem) {'''
          new = '''                if (stack.getItem() == MoCItems.SILVERSWORD.get()) {\n                    i = 10F;\n                } else if (stack.is(Items.GOLDEN_SWORD)) {\n                    // Preserve the actual incoming Golden Sword damage.\n                } else if (stack.getItem() instanceof SwordItem) {'''
          if old not in s:
              raise SystemExit('Werewolf sword damage anchor not found')
          were.write_text(s.replace(old, new, 1))
          PY

          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-balance-effects-weapons.yml
          git add src/main/java/drzhark/mocreatures/MoCTools.java
          git add src/main/java/drzhark/mocreatures/entity/hunter/MoCEntityKomodo.java
          git add src/main/java/drzhark/mocreatures/entity/hostile/MoCEntityScorpion.java
          git add src/main/java/drzhark/mocreatures/init/MoCEntities.java
          git add src/main/java/drzhark/mocreatures/event/MoCEventHooks.java
          git add src/main/java/drzhark/mocreatures/entity/hostile/MoCEntityWerewolf.java
          git commit -m 'Fix combat effects mob health armor sets and gold sword'
          git push origin HEAD:fix/balance-effects-weapons-2026-08-10
