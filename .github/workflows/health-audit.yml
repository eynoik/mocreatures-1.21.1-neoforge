name: Apply audited Mo Creatures health fixes

on:
  push:
    branches: [ "agent/fix-werewolf-hurt-voice-lines" ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[health-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-werewolf-hurt-voice-lines

      - name: Apply verified health fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('src/main/java')

          def unique_file(class_name):
              matches = [p for p in ROOT.rglob(class_name + '.java') if f'class {class_name} ' in p.read_text(errors='ignore')]
              if not matches:
                  raise SystemExit(f'{class_name}: implementation not found')
              matches.sort(key=lambda p: len(p.read_text(errors='ignore')), reverse=True)
              chosen = matches[0]
              if len(matches) > 1:
                  print(f'{class_name}: choosing full implementation {chosen} over compatibility wrapper(s) {matches[1:]}')
              return chosen

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence of {old!r}, got {count}')
              path.write_text(text.replace(old, new))
              print(f'patched {path}: {old} -> {new}')

          registry = Path('src/main/java/drzhark/mocreatures/init/MoCEntities.java')
          for cls in [
              'MoCEntityBird', 'MoCEntityBunny', 'MoCEntityDeer', 'MoCEntityFilchLizard',
              'MoCEntityMole', 'MoCEntityTurtle', 'MoCEntityTurkey', 'MoCEntityHorse'
          ]:
              replace_once(registry, f'{cls}::createAttributes', f'{cls}::registerAttributes')

          # Same-class, single-value legacy comparisons from DrZhark/mocreaturesdev.
          # Werewolf/Ogre and other form/type-dependent entities are intentionally excluded.
          health_fixes = {
              'MoCEntityTurkey': ('8.0D', '6.0D'),
              'MoCEntityHorse': ('30.0D', '20.0D'),
              'MoCEntityKomodo': ('25.0D', '20.0D'),
              'MoCEntityMouse': ('8.0D', '4.0D'),
              'MoCEntityPetScorpion': ('20.0D', '15.0D'),
              'MoCEntityFlameWraith': ('25.0D', '15.0D'),
              'MoCEntityHorseMob': ('30.0D', '20.0D'),
              'MoCEntityHellRat': ('40.0D', '20.0D'),
              'MoCEntityRat': ('16.0D', '10.0D'),
              'MoCEntityWraith': ('20.0D', '10.0D'),
              'MoCEntityBee': ('10.0D', '4.0D'),
              'MoCEntityFly': ('10.0D', '2.0D'),
              'MoCEntityMaggot': ('4.0D', '2.0D'),
              'MoCEntitySnail': ('4.0D', '2.0D'),
          }
          for cls, (old_hp, new_hp) in health_fixes.items():
              p = unique_file(cls)
              replace_once(p,
                  f'.add(Attributes.MAX_HEALTH, {old_hp})',
                  f'.add(Attributes.MAX_HEALTH, {new_hp})')

          Path('.github/workflows/health-audit.yml').unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add src/main/java .github/workflows/health-audit.yml
          git diff --cached --check
          git commit -m "Fix legacy entity health values [health-fixed]"
          git push origin HEAD:agent/fix-werewolf-hurt-voice-lines
