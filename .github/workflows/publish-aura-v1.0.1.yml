name: Publish Aura Edition v1.0.1

on:
  push:
    branches: [ "agent/finish-neoforge-port" ]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_RUN: "31485377552"
      VALIDATED_SHA: "48b6392d24f0dfcb851cede95312c45b07d08fb2"
      TAG: "aura-edition-1.21.1-v1.0.1"
      OUT_JAR: "Mo-Creatures-Aura-Edition-1.21.1-v1.0.1.jar"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/finish-neoforge-port
          fetch-depth: 0

      - name: Download validated build artifact
        shell: bash
        run: |
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name mocreatures-build-output --dir release-artifact
          JAR="$(find release-artifact -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" "$OUT_JAR"
          sha256sum "$OUT_JAR" > aura-release-v1.0.1-sha256.txt
          ls -lh "$OUT_JAR" aura-release-v1.0.1-sha256.txt

      - name: Remove one-time workflow from branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-aura-v1.0.1.yml
          git commit -m 'Remove one-time Aura Edition v1.0.1 release workflow'
          git push origin HEAD:agent/finish-neoforge-port

      - name: Publish GitHub pre-release from validated JAR
        shell: bash
        run: |
          gh release create "$TAG" \
            "$OUT_JAR" \
            aura-release-v1.0.1-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_SHA" \
            --title "Mo' Creatures: Aura Edition 1.21.1 - v1.0.1" \
            --prerelease \
            --notes $'## Aura Edition v1.0.1\n\nFan-made slop port of Mo\x27 Creatures: Nostalgia Edition 1.20.1 Forge to Minecraft 1.21.1 NeoForge.\n\n### Fixes in this release\n- Human-form werewolf now has working audio: player hurt/death fallbacks when legacy werehuman sounds are disabled, while the existing legacy custom sounds remain available when enabled.\n- Human-form werewolf now has a subtle idle breathing sound instead of being completely silent.\n- Butterfly render bobbing no longer mutates state per rendered frame; it is driven by game ticks + partial ticks to remove FPS/render-pass dependent visual jitter.\n\nThis exact JAR comes from validated GitHub Actions run 31485377552: build PASS, dedicated server smoke PASS, headless client smoke PASS.\n\nThe port may still contain bugs. Back up important modded worlds.'
