name: Remove stale grasshopper sound entry

on:
  push:
    branches:
      - agent/fix-werewolf-hurt-voice-lines
    paths:
      - .github/workflows/remove-stale-grasshopper-sound.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-werewolf-hurt-voice-lines
          fetch-depth: 0

      - name: Remove dangling grasshopper ambient event
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/resources/assets/mocreatures/sounds.json')
          text = path.read_text(encoding='utf-8')
          pattern = r'(?ms)^  "grasshopperambient": \{\n.*?^  \},\n(?=  "grasshopperchirp":)'
          updated, count = re.subn(pattern, '', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one grasshopperambient block, found {count}; refusing to edit')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit source change and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/remove-stale-grasshopper-sound.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove stale grasshopper ambient sound entry"
          git push origin HEAD:agent/fix-werewolf-hurt-voice-lines
