name: Apply werehuman sound and butterfly smoothing fixes

on:
  push:
    branches: [ "agent/finish-neoforge-port" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/finish-neoforge-port
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Werehuman sounds: preserve legacy toggle, but use actual player sounds as the
          # non-legacy fallback and give the otherwise-silent human form a subtle breath ambient.
          p = Path('src/main/java/drzhark/mocreatures/entity/hostile/MoCEntityWerewolf.java')
          s = p.read_text()
          replacements = [
              (
                  'return MoCreatures.proxy.legacyWerehumanSounds ? MoCSoundEvents.ENTITY_WEREWOLF_DEATH_HUMAN.get() : SoundEvents.GENERIC_HURT;',
                  'return MoCreatures.proxy.legacyWerehumanSounds ? MoCSoundEvents.ENTITY_WEREWOLF_DEATH_HUMAN.get() : SoundEvents.PLAYER_DEATH;'
              ),
              (
                  'return MoCreatures.proxy.legacyWerehumanSounds ? MoCSoundEvents.ENTITY_WEREWOLF_HURT_HUMAN.get() : SoundEvents.GENERIC_HURT;',
                  'return MoCreatures.proxy.legacyWerehumanSounds ? MoCSoundEvents.ENTITY_WEREWOLF_HURT_HUMAN.get() : SoundEvents.PLAYER_HURT;'
              ),
              (
                  '''        if (getIsHumanForm()) {\n            return null;\n        } else {\n            return MoCSoundEvents.ENTITY_WEREWOLF_AMBIENT.get();\n        }''',
                  '''        if (getIsHumanForm()) {\n            // Human-form werewolves used to be completely silent while idle.\n            // Use the quiet vanilla player breath without replacing the legacy hurt/death toggle.\n            return SoundEvents.PLAYER_BREATH;\n        } else {\n            return MoCSoundEvents.ENTITY_WEREWOLF_AMBIENT.get();\n        }'''
              )
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Werewolf sound anchor not found: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Butterfly bobbing was render-frame driven: tFloat() incremented mutable entity state
          # every time the renderer called scale(), so FPS/render-pass count changed the phase and
          # produced visible jitter. Make it a pure tick + partial-tick interpolation instead.
          p = Path('src/main/java/drzhark/mocreatures/entity/ambient/MoCEntityButterfly.java')
          s = p.read_text()
          s = s.replace('    private int fCounter;\n\n', '', 1)
          old = '''    public float tFloat() {\n        if (!getIsFlying()) {\n            return 0F;\n        }\n        if (++this.fCounter > 1000) {\n            this.fCounter = 0;\n        }\n\n        return Mth.cos((this.fCounter * 0.1F)) * 0.2F;\n    }'''
          new = '''    public float tFloat(float partialTick) {\n        if (!getIsFlying()) {\n            return 0F;\n        }\n        // Pure render interpolation: never mutate entity state from the renderer.\n        return Mth.cos((this.tickCount + partialTick) * 0.1F) * 0.2F;\n    }'''
          if old not in s:
              raise SystemExit('Butterfly tFloat anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/main/java/drzhark/mocreatures/client/renderer/entity/MoCRenderButterfly.java')
          s = p.read_text()
          old = 'adjustHeight(entitybutterfly, entitybutterfly.tFloat(), poseStack);'
          new = 'adjustHeight(entitybutterfly, entitybutterfly.tFloat(par2), poseStack);'
          if old not in s:
              raise SystemExit('Butterfly renderer tFloat anchor not found')
          p.write_text(s.replace(old, new, 1))

          # New public build/release version.
          p = Path('gradle.properties')
          s = p.read_text()
          old = 'mod_version=1.21.1-1.0.0-neoforge-port'
          new = 'mod_version=1.21.1-1.0.1-neoforge-port'
          if old not in s:
              raise SystemExit('Version anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-werehuman-butterfly-fix.yml
          git add gradle.properties
          git add src/main/java/drzhark/mocreatures/entity/hostile/MoCEntityWerewolf.java
          git add src/main/java/drzhark/mocreatures/entity/ambient/MoCEntityButterfly.java
          git add src/main/java/drzhark/mocreatures/client/renderer/entity/MoCRenderButterfly.java
          git commit -m 'Fix werehuman sounds and smooth butterfly rendering'
          git push origin HEAD:agent/finish-neoforge-port
