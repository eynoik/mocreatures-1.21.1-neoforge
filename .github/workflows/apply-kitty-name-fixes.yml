name: Apply Kitty AI and pet-name fixes

on:
  push:
    branches: [ "agent/finish-neoforge-port" ]
    paths:
      - ".github/workflows/apply-kitty-name-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply source fixes and build
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          kitty = Path('src/main/java/drzhark/mocreatures/entity/neutral/MoCEntityKitty.java')
          s = kitty.read_text(encoding='utf-8')
          anchor = 'import drzhark.mocreatures.entity.MoCEntityAnimal;\n'
          addition = 'import drzhark.mocreatures.entity.passive.MoCEntityMouse;\n'
          assert anchor in s, 'Kitty entity import anchor missing'
          if addition not in s:
              s = s.replace(anchor, anchor + addition, 1)
          anchor = 'import net.minecraft.world.entity.ai.goal.WaterAvoidingRandomStrollGoal;\n'
          addition = 'import net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal;\n'
          assert anchor in s, 'Kitty AI import anchor missing'
          if addition not in s:
              s = s.replace(anchor, anchor + addition, 1)
          old = '        this.goalSelector.addGoal(6, new WaterAvoidingRandomStrollGoal(this, 1.0D));\n        this.goalSelector.addGoal(7, new LookAtPlayerGoal(this, Player.class, 8.0F));\n    }\n'
          new = '        this.goalSelector.addGoal(6, new WaterAvoidingRandomStrollGoal(this, 1.0D));\n        this.goalSelector.addGoal(7, new LookAtPlayerGoal(this, Player.class, 8.0F));\n        // Cats should actively hunt Mo Creatures mice.\n        this.targetSelector.addGoal(1, new NearestAttackableTargetGoal<>(this, MoCEntityMouse.class, true));\n    }\n\n    /** Players are not a fear source for kitties; normal fear rules still apply to other mobs. */\n    @Override\n    public boolean entitiesToInclude(Entity entity) {\n        return !(entity instanceof Player) && super.entitiesToInclude(entity);\n    }\n'
          assert old in s, 'Kitty registerGoals block changed unexpectedly'
          s = s.replace(old, new, 1)
          kitty.write_text(s, encoding='utf-8')

          animal = Path('src/main/java/drzhark/mocreatures/entity/MoCEntityAnimal.java')
          s = animal.read_text(encoding='utf-8')
          old = '    @Override\n    public void setPetName(String name) {\n        this.entityData.set(NAME_STR, name);\n    }\n'
          new = '    @Override\n    public void setPetName(String name) {\n        String petName = name == null ? "" : name.trim();\n        this.entityData.set(NAME_STR, petName);\n\n        // Keep the legacy MoC name and vanilla 1.21 CustomName in sync.\n        if (petName.isEmpty()) {\n            this.setCustomName(null);\n            this.setCustomNameVisible(false);\n        } else {\n            this.setCustomName(Component.literal(petName));\n            this.setCustomNameVisible(MoCreatures.proxy.getDisplayPetName());\n        }\n    }\n'
          assert old in s, 'MoCEntityAnimal setPetName block changed unexpectedly'
          s = s.replace(old, new, 1)
          animal.write_text(s, encoding='utf-8')
          PY

          git diff --check
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-kitty-name-fixes.yml
          git add -A
          git diff --cached --check
          git commit -m "Fix Kitty mouse hunting and pet nametags"
          git push origin "HEAD:${GITHUB_REF_NAME}"
