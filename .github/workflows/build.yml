name: Build Mo Creatures NeoForge 1.21.1

on:
  push:
    branches: [ "main", "agent/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize event subscriber cleanup
        if: startsWith(github.ref, 'refs/heads/agent/')
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/main/java/drzhark/mocreatures/init/MoCBlocks.java': [
                  ('@EventBusSubscriber(modid = MoCConstants.MOD_ID, bus = EventBusSubscriber.Bus.MOD)\npublic class MoCBlocks {',
                   'public class MoCBlocks {'),
              ],
              'src/main/java/drzhark/mocreatures/init/MoCCreativeTabs.java': [
                  ('import net.neoforged.fml.common.EventBusSubscriber;\n', ''),
                  ('@EventBusSubscriber(modid = MoCConstants.MOD_ID, bus = EventBusSubscriber.Bus.MOD)\n', ''),
              ],
              'src/main/java/drzhark/mocreatures/compat/CompatHandler.java': [
                  ('import net.neoforged.fml.common.EventBusSubscriber;\n', ''),
                  ('@EventBusSubscriber(modid = MoCConstants.MOD_ID, bus = EventBusSubscriber.Bus.MOD)\n', ''),
              ],
              'src/main/java/drzhark/mocreatures/world/MoCWorldRegistry.java': [
                  ('import net.neoforged.fml.common.EventBusSubscriber;\n', ''),
                  ('@EventBusSubscriber(modid = MoCConstants.MOD_ID, bus = EventBusSubscriber.Bus.MOD)\n', ''),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('fixed', filename)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/drzhark/mocreatures/init/MoCBlocks.java \
                  src/main/java/drzhark/mocreatures/init/MoCCreativeTabs.java \
                  src/main/java/drzhark/mocreatures/compat/CompatHandler.java \
                  src/main/java/drzhark/mocreatures/world/MoCWorldRegistry.java
          if ! git diff --cached --quiet; then
            git commit -m "Remove invalid empty NeoForge event subscribers"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build from repository source
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          mkdir -p build
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee compile.log
          STATUS=${PIPESTATUS[0]}
          exit $STATUS

      - name: Server load smoke test
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          rm -f server-smoke.log
          set +e
          timeout 90s ./gradlew runServer --no-daemon 2>&1 | tee server-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -q 'Done (' run/server/logs/latest.log 2>/dev/null; then
            echo 'Server reached Done: runtime load smoke test passed.'
            exit 0
          fi
          echo "Server did not reach Done (gradle/timeout status: $STATUS)."
          if [ -f run/server/logs/latest.log ]; then tail -200 run/server/logs/latest.log; fi
          exit 1

      - name: Upload JARs, compiler log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocreatures-build-output
          if-no-files-found: warn
          path: |
            compile.log
            server-smoke.log
            run/server/logs/latest.log
            build/libs/*.jar
            build/reports/**
            build/tmp/**
