name: Build Mo Creatures NeoForge 1.21.1

on:
  push:
    branches: [ "main", "agent/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build from repository source
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          mkdir -p build
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee compile.log
          STATUS=${PIPESTATUS[0]}
          exit $STATUS

      - name: Server load and datapack smoke test
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          rm -f server-smoke.log
          set +e
          timeout 90s ./gradlew runServer --no-daemon 2>&1 | tee server-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e

          LOG=run/server/logs/latest.log
          if ! grep -q 'Done (' "$LOG" 2>/dev/null; then
            echo "Server did not reach Done (gradle/timeout status: $STATUS)."
            if [ -f "$LOG" ]; then tail -200 "$LOG"; fi
            exit 1
          fi

          if grep -E "Couldn't parse element .*mocreatures:|Parsing error loading recipe mocreatures:" "$LOG"; then
            echo "Mo' Creatures datapack/loot/recipe parse errors detected."
            exit 1
          fi

          echo 'Server reached Done and Mo Creatures data parsed without loot/recipe errors.'

      - name: Client startup smoke test
        shell: bash
        run: |
          set -uo pipefail
          rm -f client-smoke.log
          rm -rf run/client/crash-reports
          mkdir -p run/client

          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          set +e
          timeout 90s xvfb-run -a ./gradlew runClient --no-daemon 2>&1 | tee client-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e

          LOG=run/client/logs/latest.log

          # A healthy client normally keeps running at the title screen until timeout (124).
          # Any other non-zero exit means startup itself failed.
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "Client exited during startup (status: $STATUS)."
            if [ -f "$LOG" ]; then tail -250 "$LOG"; fi
            exit 1
          fi

          if compgen -G 'run/client/crash-reports/*.txt' > /dev/null; then
            echo 'Minecraft generated a client crash report.'
            tail -250 run/client/crash-reports/*.txt || true
            exit 1
          fi

          if [ ! -f "$LOG" ]; then
            echo 'Client did not create latest.log; startup was not validated.'
            tail -250 client-smoke.log || true
            exit 1
          fi

          if grep -E "Error loading mods|has failed to load correctly|Failure message:.*mocreatures|Exception caught during firing event" "$LOG"; then
            echo "Mo' Creatures client startup error detected."
            tail -250 "$LOG"
            exit 1
          fi

          echo 'Client stayed alive through the startup smoke-test window without a mod-loading crash.'

      - name: Upload JARs, compiler log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocreatures-build-output
          if-no-files-found: warn
          path: |
            compile.log
            server-smoke.log
            client-smoke.log
            run/server/logs/latest.log
            run/client/logs/latest.log
            run/client/crash-reports/**
            build/libs/*.jar
            build/reports/**
            build/tmp/**

      - name: Publish Aura Edition v1.0.4 prerelease
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/agent/fix-werewolf-hurt-voice-lines' && contains(github.event.head_commit.message, '[release v1.0.4]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          RELEASE_TAG="aura-edition-1.21.1-v1.0.4"
          RELEASE_JAR="Mo-Creatures-Aura-Edition-1.21.1-v1.0.4.jar"
          CHECKSUM_FILE="aura-release-v1.0.4-sha256.txt"

          BUILT_JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$BUILT_JAR"
          cp "$BUILT_JAR" "$RELEASE_JAR"
          sha256sum "$RELEASE_JAR" > "$CHECKSUM_FILE"

          cat > release-notes.md <<'EOF'
          ## Aura Edition v1.0.4

          Fan-made port of Mo' Creatures: Nostalgia Edition to Minecraft 1.21.1 NeoForge.

          ### Entity health fixes
          - Fixed Bird and Bunny receiving the generic 20 HP attribute set instead of their own small-mob health values.
          - Fixed the same attribute-registration bug for Deer, Filch Lizard, Mole, Turtle, Turkey and Wild Horse.
          - Restored legacy health values for Turkey (6), Wild Horse (20), Komodo (20), Mouse (4), Pet Scorpion (15), Flame Wraith (15), Horse Mob (20), Hell Rat (20), Rat (10), Wraith (10), Bee (4), Fly (2), Maggot (2) and Snail (2).
          - Health values were audited against DrZhark's original Mo' Creatures sources. Form/type-dependent entities such as Werewolf and Ogre were intentionally not flattened to a single legacy value.

          This release is published only after the GitHub Actions build, dedicated-server/datapack smoke test, and headless client startup smoke test all pass.

          The port may still contain bugs. Back up important modded worlds.
          EOF

          gh release create "$RELEASE_TAG" "$RELEASE_JAR" "$CHECKSUM_FILE" \
            --target "$GITHUB_SHA" \
            --title "Mo' Creatures: Aura Edition 1.21.1 - v1.0.4" \
            --notes-file release-notes.md \
            --prerelease
