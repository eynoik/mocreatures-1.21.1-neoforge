name: Build Mo Creatures NeoForge 1.21.1

on:
  push:
    branches: [ "main", "agent/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build from repository source
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          mkdir -p build
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee compile.log
          STATUS=${PIPESTATUS[0]}
          exit $STATUS

      - name: Server load and datapack smoke test
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          rm -f server-smoke.log
          set +e
          timeout 90s ./gradlew runServer --no-daemon 2>&1 | tee server-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e

          LOG=run/server/logs/latest.log
          if ! grep -q 'Done (' "$LOG" 2>/dev/null; then
            echo "Server did not reach Done (gradle/timeout status: $STATUS)."
            if [ -f "$LOG" ]; then tail -200 "$LOG"; fi
            exit 1
          fi

          if grep -E "Couldn't parse element .*mocreatures:|Parsing error loading recipe mocreatures:" "$LOG"; then
            echo "Mo' Creatures datapack/loot/recipe parse errors detected."
            exit 1
          fi

          echo 'Server reached Done and Mo Creatures data parsed without loot/recipe errors.'

      - name: Upload JARs, compiler log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocreatures-build-output
          if-no-files-found: warn
          path: |
            compile.log
            server-smoke.log
            run/server/logs/latest.log
            build/libs/*.jar
            build/reports/**
            build/tmp/**
