name: Build Mo Creatures NeoForge 1.21.1

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack port into repository
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f ./gradlew ]; then
            echo "Project is already unpacked."
            echo "PORT_ROOT=." >> "$GITHUB_ENV"
            exit 0
          fi

          ARCHIVE=$(find . -type f \( -name '*stage1*.zip' -o -name '*neoforge-port*.zip' \) | head -n 1)
          if [ -z "${ARCHIVE:-}" ]; then
            echo 'ERROR: neither gradlew nor the stage1 port ZIP was found.'
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          rm -rf .unpack-port
          mkdir -p .unpack-port
          unzip -q "$ARCHIVE" -d .unpack-port

          ROOT=$(find .unpack-port -name gradlew -type f -printf '%h\n' | head -n 1)
          if [ -z "${ROOT:-}" ]; then
            echo 'ERROR: gradlew not found inside archive.'
            exit 1
          fi

          echo "Copying project from $ROOT to repository root"
          rsync -a --exclude='.git/' --exclude='.github/' "$ROOT/" ./

          git rm -f "$ARCHIVE"
          rm -rf .unpack-port

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Unpack Mo Creatures 1.21.1 NeoForge port source"
            git push origin HEAD:main
          fi

          echo "PORT_ROOT=." >> "$GITHUB_ENV"

      - name: Apply NeoForge 1.21.1 port fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/port_fixes.py

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Align Gradle wrapper with NeoForge build
        shell: bash
        run: |
          set -euxo pipefail
          WRAPPER="$PORT_ROOT/gradle/wrapper/gradle-wrapper.properties"
          sed -i -E 's#gradle-[0-9.]+-bin\.zip#gradle-9.2.1-bin.zip#' "$WRAPPER"
          grep distributionUrl "$WRAPPER"

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PORT_ROOT"
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: Upload JARs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocreatures-build-output
          if-no-files-found: warn
          path: |
            ${{ env.PORT_ROOT }}/build/libs/*.jar
            ${{ env.PORT_ROOT }}/build/reports/**
            ${{ env.PORT_ROOT }}/build/tmp/**
