name: Build Mo Creatures NeoForge 1.21.1

on:
  push:
    branches: [ "main", "agent/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build from repository source
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          mkdir -p build
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee compile.log
          STATUS=${PIPESTATUS[0]}
          exit $STATUS

      - name: Upload JARs, compiler log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocreatures-build-output
          if-no-files-found: warn
          path: |
            compile.log
            build/libs/*.jar
            build/reports/**
            build/tmp/**
