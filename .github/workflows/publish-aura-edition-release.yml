name: Publish Aura Edition release

on:
  push:
    branches: [ "agent/finish-neoforge-port" ]
    paths:
      - ".github/workflows/publish-aura-edition-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/finish-neoforge-port
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Aura Edition JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build --no-daemon
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" "Mo-Creatures-Aura-Edition-1.21.1-v1.0.0.jar"
          sha256sum "Mo-Creatures-Aura-Edition-1.21.1-v1.0.0.jar" | tee aura-release-sha256.txt

      - name: Remove one-time workflow from branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-aura-edition-release.yml
          git commit -m 'Remove one-time Aura Edition release workflow'
          git push origin HEAD:agent/finish-neoforge-port
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='aura-edition-1.21.1-v1.0.0'
          cat > release-notes.md <<'EOF'
          # Mo' Creatures: Aura Edition — Minecraft 1.21.1 NeoForge

          Fan-made **slop port** of **Mo' Creatures: Nostalgia Edition for Minecraft 1.20.1 Forge** to **Minecraft 1.21.1 NeoForge**, made mainly for playing with friends.

          This build includes the current Aura Edition fixes, including the Wyvern Lair world-generation freeze / feature-order-cycle fix.

          The port may still contain bugs, incomplete behavior, or edge cases. It should be safe for normal use in your own worlds, but making a backup of important modded worlds is recommended.

          **Aura Edition / 1.21.1 port:** meynoik. Original Mo' Creatures, Nostalgia Edition, Extended and legacy creator credits remain with their respective authors as listed in the repository README.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Mo-Creatures-Aura-Edition-1.21.1-v1.0.0.jar" aura-release-sha256.txt --clobber
            gh release edit "$TAG" --title "Mo' Creatures: Aura Edition 1.21.1 - v1.0.0" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" \
              "Mo-Creatures-Aura-Edition-1.21.1-v1.0.0.jar" \
              aura-release-sha256.txt \
              --target "$RELEASE_TARGET" \
              --title "Mo' Creatures: Aura Edition 1.21.1 - v1.0.0" \
              --notes-file release-notes.md \
              --prerelease
          fi
