name: Apply nametag and Ogre AOE fixes

on:
  push:
    branches: [ "fix/nametag-ogre-aoe-2026-08-10" ]
    paths:
      - ".github/workflows/apply-nametag-ogre-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          animal = Path('src/main/java/drzhark/mocreatures/entity/MoCEntityAnimal.java')
          s = animal.read_text(encoding='utf-8')
          old = '''    @OnlyIn(Dist.CLIENT)\n    @Override\n    public Component getName() {\n        String entityString = this.getType().getDescriptionId();\n'''
          new = '''    @OnlyIn(Dist.CLIENT)\n    @Override\n    public Component getName() {\n        // A real custom pet name must win over MoC verbose species names.\n        // Vanilla name-tag rendering asks getName()/getDisplayName(), so ignoring\n        // CustomName here made renamed pets look named internally but blank overhead.\n        if (this.hasCustomName() && this.getCustomName() != null) {\n            return this.getCustomName();\n        }\n\n        String entityString = this.getType().getDescriptionId();\n'''
          assert old in s, 'MoCEntityAnimal getName anchor not found'
          s = s.replace(old, new, 1)

          old = '            this.setCustomNameVisible(MoCreatures.proxy.getDisplayPetName());\n'
          new = '''            // Keep vanilla semantics: the name is visible when the player aims at\n            // the mob. MoC can still draw persistent pet names through its own renderer.\n            this.setCustomNameVisible(false);\n'''
          assert old in s, 'MoCEntityAnimal custom-name visibility anchor not found'
          s = s.replace(old, new, 1)
          animal.write_text(s, encoding='utf-8')

          tools = Path('src/main/java/drzhark/mocreatures/MoCTools.java')
          s = tools.read_text(encoding='utf-8')

          old = '                        if (power > 0.0F && py > entity.getY() && state.getDestroySpeed(level, pos) < 3.0F) {\n'
          new = '''                        // Full spherical blast. The old port only collected blocks above\n                        // the Ogre, producing a clipped half-explosion. Explosion resistance\n                        // already drains ray power; negative destroy speed protects unbreakables.\n                        if (power > 0.0F && !state.isAir() && state.getDestroySpeed(level, pos) >= 0.0F) {\n'''
          assert old in s, 'destroyBlast affected-block condition not found'
          s = s.replace(old, new, 1)

          old = '                if (e instanceof MoCEntityOgre) continue;\n'
          new = '''                // Damage everything caught in the blast except the Ogre that\n                // generated this specific blast. Other Ogres are valid victims.\n                if (e == entity) continue;\n'''
          assert old in s, 'destroyBlast Ogre exclusion not found'
          s = s.replace(old, new, 1)
          tools.write_text(s, encoding='utf-8')
          PY

          git diff --check
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-nametag-ogre-fixes.yml
          git add -A
          git diff --cached --check
          git commit -m "Fix pet hover nametags and Ogre radial blast"
          git push origin "HEAD:${GITHUB_REF_NAME}"
